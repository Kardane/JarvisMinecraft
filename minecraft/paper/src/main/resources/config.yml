# Provider credentials. Environment/system-property values take precedence.
openai-api-key: ""
typesafe-api-key: ""

# Phase 1 runtime policy configuration.
# These values are loaded and validated now, but chat/tool policy wiring is
# intentionally deferred to later phases so current v0.1 behavior is unchanged.
jarvis:
  interaction:
    mode: PASSIVE
    wake-words:
      - "자비스"
      - "jarvis"
      - "재비스"
    follow-up-seconds: 120

    audience:
      mode: OP
      whitelist: []
      blacklist: []

    proactive:
      context-messages: 12
      cooldown-seconds: 15
      confidence-threshold: 0.75

  model:
    name: "gpt-6-luna"
    reasoning:
      mode: AUTO
      fallback: MEDIUM

  response:
    # Legacy Minecraft ampersand codes are supported in the prefix only.
    # Example: "&5[JARVIS]&r "
    prefix: "[JARVIS] "
    waiting-message:
      enabled: true
      threshold-ms: 1800
      messages:
        - "잠시만요."
        - "확인해볼게요."
        - "서버 상태를 살펴보고 있어요."

    sound:
      enabled: false
      id: "minecraft:block.note_block.pling"
      volume: 1.0
      pitch: 1.0

  execution:
    # READ_TALK: read-only Tools only.
    # EXECUTE_LITE: read-only + explicitly allowed LOW-risk state-changing Tools.
    # EXECUTE: read-only + explicitly allowed state-changing Tools.
    mode: READ_TALK
    actors: OP

    lite:
      # Tool wire names only. Example: [teleport_staff]
      allow-tools: []
      # deny-tools overrides allow-tools and may also hide read-only Tools.
      deny-tools: []

    full:
      # State-changing Tool wire names must be explicitly listed.
      allow-tools: []
      deny-tools: []

  scheduling:
    enabled: false
    max-delay-seconds: 60
    max-duration-seconds: 60
