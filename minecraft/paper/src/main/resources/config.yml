# Provider credentials. Environment/system-property values take precedence.
openai-api-key: ""
typesafe-api-key: ""

# Phase 1 runtime policy configuration.
# These values are loaded and validated now, but chat/tool policy wiring is
# intentionally deferred to later phases so current v0.1 behavior is unchanged.
jarvis:
  interaction:
    # PASSIVE: wake-word/session interaction only.
    # ACTIVE: observe allowed public chat and let Jev decide whether JARVIS should initiate.
    mode: PASSIVE
    wake-words:
      - "자비스"
      - "jarvis"
      - "재비스"
    follow-up-seconds: 120

    audience:
      mode: OP
      whitelist: []
      blacklist: []

    proactive:
      # ACTIVE mode only. Bounded public-chat context supplied to Jev/Luna.
      context-messages: 12
      # Server-wide gap after a proactive conversation starts.
      cooldown-seconds: 15
      # Minimum Jev START_CONVERSATION confidence.
      confidence-threshold: 0.75

  model:
    name: "gpt-6-luna"
    reasoning:
      mode: AUTO
      fallback: MEDIUM

  response:
    # Legacy Minecraft ampersand codes are supported in the prefix only.
    # Example: "&5[JARVIS]&r "
    prefix: "[JARVIS] "
    waiting-message:
      enabled: true
      threshold-ms: 1800
      messages:
        - "잠시만요."
        - "확인해볼게요."
        - "서버 상태를 살펴보고 있어요."

    sound:
      enabled: false
      id: "minecraft:block.note_block.pling"
      volume: 1.0
      pitch: 1.0

  execution:
    # READ_TALK: read-only Tools only.
    # EXECUTE_LITE: read-only + explicitly allowed LOW-risk state-changing Tools.
    # EXECUTE: read-only + explicitly allowed state-changing Tools.
    mode: READ_TALK
    actors: OP

    lite:
      # Tool wire names only. Example: [teleport_staff, weather_set, time_set]
      allow-tools: []
      # deny-tools overrides allow-tools and may also hide read-only Tools.
      deny-tools: []

    full:
      # State-changing Tool wire names must be explicitly listed.
      allow-tools: []
      deny-tools: []

  scheduling:
    # Enables schedule_action for structured LOW-risk mutation Tools.
    # Pending schedules are memory-only and do not survive server restart.
    enabled: false
    max-delay-seconds: 60
    max-duration-seconds: 60

  logging:
    # Operational console logging. Audit JSONL remains independent.
    level: INFO
    console:
      enabled: true
    request:
      lifecycle: true
    ai:
      jev: true
      luna: true
    tool:
      lifecycle: true
    proactive:
      decisions: false
    health:
      interval-seconds: 30
