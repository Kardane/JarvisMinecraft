name: JarvisMinecraft
version: 0.1.0-dev
main: io.github.kardane.jarvisminecraft.paper263.JarvisPaper263Plugin
api-version: '26.2'
description: OP-gated AI operations assistant with public chat replies for Minecraft servers.
authors: [Kardane]
softdepend: [CMILib, CMI, CoreProtect, WorldEdit, WorldGuard]

commands:
  jm:
    description: Shows JARVIS status/statistics or reloads runtime configuration.
    usage: /jm <status|stats|reload>
    permission: jarvisminecraft.status

permissions:
  jarvisminecraft.status:
    description: Allows viewing JARVIS runtime health and status.
    default: op
  jarvisminecraft.reload:
    description: Allows atomically reloading JARVIS runtime configuration and prompt content.
    default: op
