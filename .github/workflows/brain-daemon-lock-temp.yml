name: Brain Daemon Lock TEMP

on:
  push:
    branches:
      - codex/brain-daemon

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate lock from declared dependencies
        working-directory: brain
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: brain-daemon-package-lock
          path: brain/package-lock.json
          if-no-files-found: error
