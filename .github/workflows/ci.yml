name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  java-build:
    name: Java / Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with committed dependency locks
        run: ./gradlew build --stacktrace

  brain-build:
    name: Brain / Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: brain/package-lock.json

      - name: Install locked dependencies
        working-directory: brain
        run: npm ci

      - name: Typecheck and validate protocol fixtures
        working-directory: brain
        run: npm run check

      - name: Build Brain
        working-directory: brain
        run: npm run build

      - name: T10 acceptance contracts
        run: node --test tests/acceptance/v01-contract.test.mjs
